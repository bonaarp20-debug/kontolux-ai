name = "kontolux-main"
compatibility_date = "2026-08-14"
main = "worker.js"

[build]
command = ""

[observability]
enabled = true

[[kv_namespaces]]
binding = "PROFIL_KV"
id = "388d8d32077c4f4e9190f77f423e9a96"

[[kv_namespaces]]
binding = "ABO_KV"
id = "4af625d6126c460593f8f4b0a0c00a37"

[[kv_namespaces]]
binding = "PDF_RESULTS"
id = "ee721a489b6f41ada490ff65e31104ed"

[triggers]
# KX-N7: "30 * * * *" = stündlicher Löschplaner (regel/loeschlaeufe-plan.js, LOESCH_CRON); zählt nur, solange kein LOESCHLAUF_* auf "an" steht (Stufe 1 trocken)
crons = ["0 8 1 * *", "15 */3 * * *", "0 3 * * *", "30 * * * *"]

[vars]
KI_OPTIMIERUNG_AKTIV = "true"
# Steuerkern-Schreibweg: "aus" | "warnung" | "an" (steuerkernModus in worker.js). Jede Änderung ist ein eigener Commit plus Deploy
# (wrangler deploy überschreibt Dashboard-Werte). Release A startet mit "aus" (rollout-drehbuch.md Stolperstein 5, Schritt 2 und 10).
STEUERKERN_MODUS = "aus"
# Admin-Konsole: nur diese verifizierten Konten dürfen /admin/* aufrufen
ADMIN_EMAILS = "johannkorn7@gmail.com"
# KX-N7: Speicherdauer-Löschläufe (docs/regelbesteuerung/18-nacht-2026-11-15/n7-bericht.md). Werte: "aus" | "trocken" | "an".
# Löschen ist nicht rückholbar. Erst "trocken" (zählt und loggt nur), Bericht prüfen, dann einzeln "an". Jede Änderung: eigener Commit plus Deploy.
# LOESCHLAEUFE_MAX ist die gemeinsame Obergrenze (strengere Einstellung gewinnt): "aus" schaltet alle Läufe ab (Notaus).
# Stufe 1 (Kontolux docs/regelbesteuerung/19-phase3/loeschlaeufe-pruefung.md Abschnitt 5/6): alle außer TRENNEN "trocken" (zählt nur), TRENNEN "aus".
LOESCHLAEUFE_MAX = "an"
LOESCHLAUF_WEGWERF = "trocken"
LOESCHLAUF_ARCHIV = "trocken"
LOESCHLAUF_ADMIN = "trocken"
LOESCHLAUF_KONTOLOESCHUNG = "trocken"
LOESCHLAUF_FEEDBACK = "an"
LOESCHLAUF_ANFRAGEN = "an"
LOESCHLAUF_PROTOKOLL = "an"
LOESCHLAUF_PROTOKOLL_KV_ALT = "trocken"
LOESCHLAUF_UNBESTAETIGT = "trocken"
LOESCHLAUF_TRENNEN = "aus"
